
syntax = "proto3";

package lab6;

// Service defining our four gRPC operations
service Lab6Service {
    rpc Add (addMsg) returns (addReply);
    rpc RawImage (rawImageMsg) returns (imageReply);
    rpc DotProduct (dotProductMsg) returns (dotProductReply);
    rpc JsonImage (jsonImageMsg) returns (imageReply);
}

// Request for adding two numbers
message addMsg {
    int32 a = 1;
    int32 b = 2;
}

// Request containing raw image bytes
message rawImageMsg {
    bytes img = 1;
}

// Request containing two vectors
message dotProductMsg {
    repeated float a = 1;
    repeated float b = 2;
}

// Request containing a Base64 image string
message jsonImageMsg {
    string img = 1;
}

// Response for addition
message addReply {
    int32 sum = 1;
}

// Response for dot product
message dotProductReply {
    float dotproduct = 1;
}

// Response containing image dimensions
message imageReply {
    int32 width = 1;
    int32 height = 2;
}
